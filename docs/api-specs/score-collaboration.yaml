  /api/suggestions/{id}/accept:
    post:
      tags: [Score suggestions]
      summary: Chấp nhận các ô nhịp đã chọn (tất cả nếu changeIds là null) thành phiên bản mới (cần quyền EDIT)
      description: "Header If-Match: \"v{currentVersion}\". Lỗi: 2014 xung đột version, 3113 đề xuất đã lỗi thời, 3114 đề xuất không còn mở, 3116 changeIds sai"
      operationId: acceptSuggestions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseSuggestionDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/suggestions/{id}/content:
    get:
      tags: [Score suggestions]
      summary: MusicXML của đề xuất sửa (tác giả hoặc người sửa)
      description: "option = 1 (mặc định) là nội dung chính; 2, 3 là phương án khác của gợi ý hợp âm (xem optionCount). 2002 khi file đã bị dọn sau 30 ngày kể từ lúc đề xuất đóng hoặc không có phương án đó"
      operationId: content
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: option
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
      responses:
        '200':
          description: Thành công
          content:
            application/vnd.recordare.musicxml+xml:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/suggestions/{id}/reject:
    post:
      tags: [Score suggestions]
      summary: Từ chối đề xuất sửa (cần quyền EDIT)
      operationId: reject
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
