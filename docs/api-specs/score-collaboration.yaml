components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token trả về khi đăng nhập (header Authorization: Bearer ...)"
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Web app gửi access token qua cookie HttpOnly access_token
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Khóa bí mật dùng chung với music-ai (biến môi trường AI_INTERNAL_KEY); chỉ nhận từ mạng nội bộ

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (code nghiệp vụ trong body, ví dụ 1009)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn (1001) hoặc sai X-Internal-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Forbidden:
      description: Không có quyền thực hiện (1002)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'

  schemas:
    AccessRequestRequest:
      type: object
      properties:
        permission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
        message:
          type: string
          maxLength: 500
          minLength: 0
      required:
        - permission
    AccessRequestResponse:
      type: object
      properties:
        memberId:
          type: string
        email:
          type: string
        fullName:
          type: string
        requestedPermission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
        currentPermission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
        message:
          type: string
        requestedAt:
          type: string
          format: date-time
    CommentMemberResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
    MyAccessResponse:
      type: object
      properties:
        accessLevel:
          type: string
        requestedPermission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
    PageResponseSuggestionSummaryResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionSummaryResponse'
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ReportRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
            - COPYRIGHT
            - SPAM
            - INAPPROPRIATE
            - OTHER
        details:
          type: string
    ReviewListResponse:
      type: object
      properties:
        averageRating:
          type: number
          format: double
        ratingCount:
          type: integer
          format: int64
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/ReviewResponse'
    ReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 2000
          minLength: 0
    ReviewResponse:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        email:
          type: string
        fullName:
          type: string
        rating:
          type: integer
          format: int32
        comment:
          type: string
        mine:
          type: boolean
        canDelete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScoreCommentReplyRequest:
      type: object
      properties:
        content:
          type: string
        mentionIds:
          type: array
          items:
            type: string
    ScoreCommentRequest:
      type: object
      properties:
        content:
          type: string
        startMeasure:
          type: integer
          format: int32
        endMeasure:
          type: integer
          format: int32
        partId:
          type: string
        noteIds:
          type: array
          items:
            type: string
        mentionIds:
          type: array
          items:
            type: string
    ScoreCommentResponse:
      type: object
      properties:
        id:
          type: string
        scoreId:
          type: string
        parentId:
          type: string
        author:
          $ref: '#/components/schemas/CommentMemberResponse'
        content:
          type: string
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/CommentMemberResponse'
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
        startMeasure:
          type: integer
          format: int32
        endMeasure:
          type: integer
          format: int32
        partId:
          type: string
        noteIds:
          type: array
          items:
            type: string
        scoreVersion:
          type: integer
          format: int32
        outdated:
          type: boolean
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
        resolvedBy:
          $ref: '#/components/schemas/CommentMemberResponse'
        resolvedAt:
          type: string
          format: date-time
        replies:
          type: array
          items: {}
        canEdit:
          type: boolean
        canDelete:
          type: boolean
        canResolve:
          type: boolean
    ScoreCommentUpdateRequest:
      type: object
      properties:
        content:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - RESOLVED
        mentionIds:
          type: array
          items:
            type: string
    ScoreCommentsResponse:
      type: object
      properties:
        canComment:
          type: boolean
        measureCount:
          type: integer
          format: int32
        currentVersion:
          type: integer
          format: int32
        openCount:
          type: integer
          format: int64
        resolvedCount:
          type: integer
          format: int64
        mentionedCount:
          type: integer
          format: int64
        comments:
          type: array
          items:
            $ref: '#/components/schemas/ScoreCommentResponse'
    ScoreLinkRequest:
      type: object
      properties:
        permission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
    ScoreSharingResponse:
      type: object
      properties:
        visibility:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ShareMemberResponse'
        pendingRequests:
          type: integer
          format: int64
    ShareMemberRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
        permission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
      required:
        - email
        - permission
    ShareMemberResponse:
      type: object
      properties:
        memberId:
          type: string
        email:
          type: string
        fullName:
          type: string
        permission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
        source:
          type: string
          enum:
            - DIRECT
    SharePermissionRequest:
      type: object
      properties:
        permission:
          type: string
          enum:
            - "1"
            - "2"
            - "3"
      required:
        - permission
    SuggestionChangeResponse:
      type: object
      properties:
        id:
          type: string
        partIndex:
          type: integer
          format: int32
        partName:
          type: string
        measureIndex:
          type: integer
          format: int32
        measureNumber:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
        conflict:
          type: boolean
    SuggestionDecisionRequest:
      type: object
      properties:
        changeIds:
          type: array
          items:
            type: string
        note:
          type: string
    SuggestionDetailResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - ACCEPTED
            - PARTIAL
            - REJECTED
            - WITHDRAWN
            - OUTDATED
        structural:
          type: boolean
        stale:
          type: boolean
        changeCount:
          type: integer
          format: int32
        author:
          $ref: '#/components/schemas/CommentMemberResponse'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        scoreId:
          type: string
        scoreTitle:
          type: string
        description:
          type: string
        source:
          type: string
          enum:
            - EDITOR
            - CHORD_GENERATION
        baseVersion:
          type: integer
          format: int32
        currentVersion:
          type: integer
          format: int32
        staleReason:
          type: string
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SuggestionChangeResponse'
        decidedBy:
          $ref: '#/components/schemas/CommentMemberResponse'
        decisionNote:
          type: string
        appliedVersion:
          type: integer
          format: int32
        canDecide:
          type: boolean
        canWithdraw:
          type: boolean
        optionCount:
          type: integer
          format: int32
          description: "Số phương án (gợi ý hợp âm có tới 3; 0 khi file đã dọn)"
    SuggestionSummaryResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - ACCEPTED
            - PARTIAL
            - REJECTED
            - WITHDRAWN
            - OUTDATED
        structural:
          type: boolean
        stale:
          type: boolean
        changeCount:
          type: integer
          format: int32
        author:
          $ref: '#/components/schemas/CommentMemberResponse'
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time

    # ── Wrapped Responses ──
    ApiResponseListAccessRequestResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 200
        message:
          type: string
