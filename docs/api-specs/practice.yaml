# ============================================================
# Practice — OpenAPI 3.0 Specification
# ============================================================
openapi: 3.0.3
info:
  title: Practice API
  description: |
    Luyện tập: Practice Studio (phiên tương tác, sự kiện nốt, báo cáo), lịch sử phiên, thống kê chuỗi ngày /
    heatmap / kỹ năng, playlist luyện tập.

    Mọi phản hồi JSON bọc trong ApiResponse {code, message, result}; code = 200 khi thành công,
    lỗi trả mã nghiệp vụ (ví dụ 1001 chưa đăng nhập, 1002 không có quyền) kèm HTTP status tương ứng.
    Sinh từ controller của music-be (springdoc /v3/api-docs) rồi chia theo nhóm chức năng.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: music-be (Spring Boot) khi chạy local
tags:
  - name: Practice Studio
    description: Dữ liệu bản nhạc phục vụ luyện tập tương tác; vòng đời phiên luyện tập tương tác
  - name: Practice Studio Reports
    description: Báo cáo và lịch sử phiên luyện tập tương tác
  - name: Practice sessions
    description: Lịch sử phiên tập của thành viên hiện tại
  - name: Practice stats
    description: Chuỗi ngày luyện tập và heatmap của thành viên hiện tại
  - name: Playlists
    description: Playlist luyện tập của thành viên hiện tại

paths:
  # ─── Practice Studio ─────────────────────────
  /api/studio/scores/{scoreId}/timeline:
    get:
      tags: [Practice Studio]
      summary: Lấy timeline nốt của bản nhạc cho Studio
      operationId: getTimeline
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioTimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/studio/sessions:
    post:
      tags: [Practice Studio]
      summary: Tạo phiên luyện tập
      operationId: createSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioSessionCreateRequest'
        required: true
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Practice Studio Reports]
      summary: Lấy lịch sử phiên luyện tập
      operationId: getSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - WAIT
              - FREE_RUN
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseStudioSessionSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/studio/sessions/active:
    get:
      tags: [Practice Studio]
      summary: Lấy phiên luyện tập đang chạy
      operationId: getActiveSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/studio/sessions/{sessionId}/abort:
    post:
      tags: [Practice Studio]
      summary: Hủy phiên luyện tập
      operationId: abortSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Thành công, không có nội dung
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/studio/sessions/{sessionId}/events:
    post:
      tags: [Practice Studio]
      summary: Gửi lô sự kiện nốt của phiên
      operationId: ingestEvents
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioEventBatchRequest'
        required: true
      responses:
        '202':
          description: Đã nhận, xử lý nền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioEventBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/studio/sessions/{sessionId}/finish:
    post:
      tags: [Practice Studio]
      summary: Kết thúc phiên và tổng hợp báo cáo
      operationId: finishSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudioSessionFinishRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Practice Studio Reports ─────────────────
  /api/studio/scores/{scoreId}/best:
    get:
      tags: [Practice Studio Reports]
      summary: Lấy phiên có điểm cao nhất
      operationId: getBestSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/studio/sessions/{sessionId}/report:
    get:
      tags: [Practice Studio Reports]
      summary: Lấy báo cáo một phiên
      operationId: getReport
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioSessionReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Practice sessions ───────────────────────
  /api/practice-sessions:
    get:
      tags: [Practice sessions]
      summary: Lịch sử luyện tập của tôi (mới nhất trước, có thể lọc theo một bản nhạc)
      operationId: listPracticeSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponsePracticeSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Practice sessions]
      summary: Lưu một phiên luyện tập
      operationId: createPracticeSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSessionRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePracticeSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/practice-sessions/{id}:
    get:
      tags: [Practice sessions]
      summary: Một phiên luyện tập của tôi (kèm danh sách lỗi)
      operationId: getPracticeSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePracticeSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Practice sessions]
      summary: Xóa một phiên luyện tập của tôi
      operationId: deletePracticeSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Practice stats ──────────────────────────
  /api/practice-stats/heatmap:
    get:
      tags: [Practice stats]
      summary: Những ngày tôi đã luyện tập (mặc định 365 ngày gần nhất), cũ nhất trước
      operationId: heatmap
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPracticeHeatmapDayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/practice-stats/skills:
    get:
      tags: [Practice stats]
      summary: Điểm 4 kỹ năng của tôi (0-100) trong N ngày gần nhất, cho biểu đồ radar
      operationId: skills
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePracticeSkillsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/practice-stats/streak:
    get:
      tags: [Practice stats]
      summary: Chuỗi ngày luyện tập hiện tại và dài nhất của tôi
      operationId: streak
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePracticeStreakResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/practice-stats/time:
    get:
      tags: [Practice stats]
      summary: Thời gian luyện tập theo DAY / WEEK / MONTH (điền 0 cho kỳ trống, cũ nhất trước)
      operationId: time
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            default: DAY
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPracticeTimeBucketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Playlists ───────────────────────────────
  /api/playlists:
    get:
      tags: [Playlists]
      summary: Danh sách playlist của tôi
      operationId: listPlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlists]
      summary: Tạo playlist
      operationId: createPlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlaylistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/playlists/{id}:
    get:
      tags: [Playlists]
      summary: Lấy một playlist của tôi
      operationId: getPlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlaylistResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Playlists]
      summary: Cập nhật tên / mô tả playlist
      operationId: updatePlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePlaylistResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Playlists]
      summary: Xóa playlist của tôi (bản nhạc được giữ lại)
      operationId: deletePlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/playlists/{id}/scores:
    get:
      tags: [Playlists]
      summary: Danh sách bản nhạc trong playlist (theo thứ tự)
      operationId: items
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Playlists]
      summary: Thêm bản nhạc vào cuối playlist
      operationId: addScorePlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistAddScoreRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/playlists/{id}/scores/order:
    put:
      tags: [Playlists]
      summary: Sắp xếp lại bản nhạc trong playlist
      operationId: reorderPlaylistsScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistOrderRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/playlists/{id}/scores/remove:
    post:
      tags: [Playlists]
      summary: Gỡ nhiều bản nhạc khỏi playlist cùng lúc (thành công hết hoặc không gỡ bản nào; bản nhạc được giữ lại)
      description: "Body {scoreIds}. Lỗi: 2601 không có playlist, 2605 danh sách rỗng hoặc có bản nhạc không nằm trong playlist"
      operationId: removeScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistOrderRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/playlists/{id}/scores/{scoreId}:
    delete:
      tags: [Playlists]
      summary: Gỡ một bản nhạc khỏi playlist (bản nhạc được giữ lại)
      operationId: removeScorePlaylists
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListPlaylistItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token trả về khi đăng nhập (header Authorization: Bearer ...)"
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Web app gửi access token qua cookie HttpOnly access_token
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Khóa bí mật dùng chung với music-ai (biến môi trường AI_INTERNAL_KEY); chỉ nhận từ mạng nội bộ

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ (code nghiệp vụ trong body, ví dụ 1009)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Unauthorized:
      description: Chưa đăng nhập, token hết hạn (1001) hoặc sai X-Internal-Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    Forbidden:
      description: Không có quyền thực hiện (1002)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponseError'

  schemas:
    JsonNode: {}
    Measure:
      type: object
      properties:
        index:
          type: integer
          format: int32
        startBeat:
          type: number
          format: double
        beats:
          type: number
          format: double
    Note:
      type: object
      properties:
        id:
          type: string
        measure:
          type: integer
          format: int32
        staff:
          type: integer
          format: int32
        hand:
          type: string
        midi:
          type: integer
          format: int32
        startBeat:
          type: number
          format: double
        durationBeat:
          type: number
          format: double
        scorable:
          type: boolean
        chordGroupId:
          type: string
        osmd:
          $ref: '#/components/schemas/OsmdPosition'
    OsmdPosition:
      type: object
      properties:
        measureIndex:
          type: integer
          format: int32
        voice:
          type: integer
          format: int32
        entryIndex:
          type: integer
