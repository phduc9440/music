# ============================================================
# Admin — OpenAPI 3.0 Specification
# ============================================================
openapi: 3.0.3
info:
  title: Admin API
  description: |
    Trang quản trị (/api/admin/**): tổng quan, thành viên, vai trò, bản nhạc, kho mẫu, nhạc sĩ, thể loại, team,
    diễn đàn, báo cáo vi phạm, luyện tập, tác vụ AI, gói / đăng ký / thanh toán, thông báo chung, hệ thống.

    Mọi phản hồi JSON bọc trong ApiResponse {code, message, result}; code = 200 khi thành công,
    lỗi trả mã nghiệp vụ (ví dụ 1001 chưa đăng nhập, 1002 không có quyền) kèm HTTP status tương ứng.
    Sinh từ controller của music-be (springdoc /v3/api-docs) rồi chia theo nhóm chức năng.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: music-be (Spring Boot) khi chạy local
tags:
  - name: Admin - Dashboard
    description: "Chỉ ROLE_ADMIN: thống kê tổng quan hệ thống"
  - name: Admin - Members
    description: "Chỉ ROLE_ADMIN: quản lý thành viên"
  - name: Admin - Roles
    description: "Chỉ SUPER_ADMIN: thêm, sửa, xóa vai trò tài khoản và tích quyền quản trị"
  - name: Admin - Scores
    description: "Chỉ ROLE_ADMIN: quản lý toàn bộ bản nhạc trong hệ thống"
  - name: Admin - Official requests
    description: "Chỉ ROLE_ADMIN: các lời xin đưa bản nhạc vào kho bản nhạc mẫu"
  - name: Admin - Composers
    description: "Chỉ ROLE_ADMIN: quản lý nhạc sĩ (mục 5.4)"
  - name: Admin - Tags
    description: "Chỉ ROLE_ADMIN: quản lý thể loại (tag) của bản nhạc"
  - name: Admin - Teams
    description: "Chỉ ROLE_ADMIN: xem và xử lý Team và Show (mục 4.1)"
  - name: Admin - Forum
    description: Quản lý diễn đàn (quyền FORUM_MANAGE)
  - name: Admin - Reports
    description: Hàng chờ báo cáo vi phạm (quyền REPORTS_MODERATE)
  - name: Admin - Practice
    description: Quản lý luyện tập (quyền PRACTICE_VIEW / PRACTICE_MANAGE)
  - name: Admin - AI Tasks
    description: "Chỉ ROLE_ADMIN: giám sát hàng đợi tác vụ AI"
  - name: Admin Plans
    description: "Gói dịch vụ: ADMIN xem, SUPER_ADMIN thêm/sửa/xóa"
  - name: Admin - Subscriptions
    description: ADMIN xem gói của thành viên; chỉ SUPER_ADMIN cấp hoặc hủy gói
  - name: Admin - Payments
    description: "Chỉ ROLE_ADMIN: doanh thu, đơn thanh toán, hoàn tiền thủ công"
  - name: Admin - Announcements
    description: "Chỉ ROLE_ADMIN: gửi thông báo chung tới người dùng"
  - name: Admin - Activity
    description: Nhật ký quản trị suy ra từ các bảng gốc (quyền AUDIT_VIEW)
  - name: Admin - System
    description: "Chỉ ROLE_ADMIN: nhật ký lỗi và thông số tải máy chủ"

paths:
  # ─── Admin - Dashboard ───────────────────────
  /api/admin/dashboard:
    get:
      tags: [Admin - Dashboard]
      summary: Số liệu tổng, bản nhạc mới / lượt luyện tập theo ngày và các phân tích (days 7-90, mặc định 30)
      operationId: getAdminDashboard
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminDashboardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Admin - Members ─────────────────────────
  /api/admin/members:
    get:
      tags: [Admin - Members]
      summary: Danh sách thành viên (phân trang, tìm theo email/tên)
      operationId: getMembers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Members]
      summary: "Tạo tài khoản (quyền MEMBERS_CREATE): đặt mật khẩu ban đầu và gán vai trò"
      description: "Lỗi: 1026 email sai, 1003 email đã có, 1007 mật khẩu dưới 8 ký tự, 1015 vai trò không có, 1025 gán SUPER_ADMIN hoặc vai trò vượt quyền của người tạo"
      operationId: createMember
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateMemberRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/members/with-plan:
    get:
      tags: [Admin - Members]
      summary: Danh sách thành viên kèm gói, lọc theo gói đang dùng (planCode) và người đang bị cấm (bannedOnly)
      operationId: getMembersWithPlan
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: planCode
          in: query
          required: false
          schema:
            type: string
        - name: bannedOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/members/{memberId}:
    get:
      tags: [Admin - Members]
      summary: Chi tiết thành viên
      operationId: getMember
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin - Members]
      summary: Khóa/mở khóa (status) và đổi vai trò (roles)
      operationId: updateMemberAdmin
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateMemberRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/members/{memberId}/detail:
    get:
      tags: [Admin - Members]
      summary: Chi tiết thành viên kèm số liệu hoạt động và bản nhạc gần đây
      operationId: getMemberDetail
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminMemberDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Admin - Roles ───────────────────────────
  /api/admin/roles:
    get:
      tags: [Admin - Roles]
      summary: Tất cả vai trò kèm quyền và số thành viên
      operationId: listAdminRoles
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListRoleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Roles]
      summary: Tạo vai trò (mã sinh từ tên hiển thị)
      operationId: createAdminRoles
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/roles/{id}:
    put:
      tags: [Admin - Roles]
      summary: "Sửa vai trò: tên hiển thị, mô tả, quyền (ADMIN: chỉ sửa quyền; USER, SUPER_ADMIN: bị khóa)"
      operationId: updateAdminRoles
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin - Roles]
      summary: Xóa vai trò tự tạo chưa ai giữ (1021 nếu đang được dùng)
      operationId: deleteAdminRoles
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Admin - Scores ──────────────────────────
  /api/admin/scores:
    get:
      tags: [Admin - Scores]
      summary: Tất cả bản nhạc của mọi người dùng (tìm theo tên / tác giả / email chủ; lọc visibility PRIVATE|PENDING|PUBLIC, official true|false, source OMR|IMPORT|MANUAL, difficulty; sắp xếp UPDATED|CREATED|TITLE|VIEWS)
      description: Xóa dùng DELETE /api/scores/{id} (đã cho phép ADMIN)
      operationId: listAdminScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: visibility
          in: query
          required: false
          schema:
            type: string
        - name: official
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/scores/bulk:
    post:
      tags: [Admin - Scores]
      summary: Áp dụng PUBLIC (chỉ duyệt bản đang chờ) / PRIVATE (gỡ bản công khai, kèm lý do) / DELETE cho tối đa 100 bản nhạc; mỗi bản xử lý riêng, bản lỗi được liệt kê
      operationId: bulk
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminScoreBulkRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminScoreBulkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/scores/{scoreId}/visibility:
    put:
      tags: [Admin - Scores]
      summary: "Kiểm duyệt: duyệt bản PENDING thành PUBLIC, hoặc gỡ bản PUBLIC về PRIVATE (lý do tùy chọn, rời kho nhạc mẫu, chủ bản được thông báo). Các chuyển trạng thái khác bị từ chối"
      operationId: setVisibility
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminScoreVisibilityRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Admin - Official requests ───────────────
  /api/admin/official-requests:
    get:
      tags: [Admin - Official requests]
      summary: "Lời xin đưa bản nhạc vào kho nhạc mẫu (mới nhất trước); status: PENDING|ACCEPTED|DECLINED|CANCELED"
      operationId: listAdminOfficialRequests
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseOfficialRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ─── Admin - Composers ───────────────────────
  /api/admin/composers:
    get:
      tags: [Admin - Composers]
      summary: Tất cả nhạc sĩ kèm số bản nhạc đã liên kết
      operationId: listAdminComposers
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListComposerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Composers]
      summary: Tạo nhạc sĩ (slug sinh từ tên); các bản nhạc có tên tác giả khớp được liên kết tự động
      operationId: createAdminComposers
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposerRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseComposerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/composers/relink:
    post:
      tags: [Admin - Composers]
      summary: Liên kết lại mọi bản nhạc với nhạc sĩ theo tên tác giả; trả về số bản đã thay đổi
      operationId: relink
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseInteger'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/composers/{id}:
    put:
      tags: [Admin - Composers]
      summary: Cập nhật nhạc sĩ và liên kết lại bản nhạc
      operationId: updateAdminComposers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposerRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseComposerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin - Composers]
      summary: Xóa nhạc sĩ (bản nhạc giữ nguyên tên tác giả, chỉ bỏ liên kết)
      operationId: deleteAdminComposers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Admin - Tags ────────────────────────────
  /api/admin/tags:
    get:
      tags: [Admin - Tags]
      summary: Danh sách thể loại kèm số bản nhạc dùng mỗi thể loại
      operationId: listAdminTags
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListAdminTagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Tags]
      summary: Tạo thể loại (slug sinh từ tên)
      operationId: createAdminTags
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminTagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/tags/{id}:
    put:
      tags: [Admin - Tags]
      summary: Đổi tên thể loại
      operationId: updateAdminTags
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      responses:
        '200':
