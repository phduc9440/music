# ============================================================
# Team & Show — OpenAPI 3.0 Specification
# ============================================================
openapi: 3.0.3
info:
  title: Team & Show API
  description: |
    Team và Show: tạo team, thành viên và vai trò, bảng quyền, lời mời (email / liên kết), bản nhạc của team,
    show, hạng mục, phân công, Kanban, thứ tự biểu diễn.

    Mọi phản hồi JSON bọc trong ApiResponse {code, message, result}; code = 200 khi thành công,
    lỗi trả mã nghiệp vụ (ví dụ 1001 chưa đăng nhập, 1002 không có quyền) kèm HTTP status tương ứng.
    Sinh từ controller của music-be (springdoc /v3/api-docs) rồi chia theo nhóm chức năng.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: music-be (Spring Boot) khi chạy local
tags:
  - name: Teams
    description: "Team và Show (mục 4.1): team, thành viên, lời mời, bản nhạc, hoạt động"
  - name: Team invitations
    description: Người được mời xem và chấp nhận lời mời vào team
  - name: Shows
    description: "Show của team (mục 4.1): bài, phân công, Kanban, thứ tự diễn"

paths:
  # ─── Teams ───────────────────────────────────
  /api/teams:
    get:
      tags: [Teams]
      summary: Các team của tôi kèm vai trò
      operationId: list
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Teams]
      summary: Tạo team (cần gói có tính năng team)
      operationId: create
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/teams/deleted:
    get:
      tags: [Teams]
      summary: Team tôi sở hữu và đã tự xóa, còn khôi phục được (30 ngày)
      operationId: deleted
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListRestorableItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams/my-tasks:
    get:
      tags: [Teams]
      summary: Hạng mục show được giao cho tôi (người phối hoặc người duyệt), chưa được duyệt
      operationId: myTasks
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamTaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams/{id}:
    get:
      tags: [Teams]
      summary: Chi tiết team (chỉ thành viên)
      operationId: get
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Teams]
      summary: Đổi tên / mô tả team (cần EDIT_TEAM, mặc định chỉ OWNER; 3802)
      operationId: update
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Xóa mềm team (OWNER); khôi phục được trong 30 ngày, 3801 không tìm thấy, 3830 không phải chủ
      operationId: delete
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/activities:
    get:
      tags: [Teams]
      summary: Nhật ký hoạt động của team, mới nhất trước
      operationId: activities
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseTeamActivityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/invitations:
    get:
      tags: [Teams]
      summary: Lời mời đang chờ (MANAGE_MEMBERS hoặc MANAGE_MANAGERS)
      operationId: invitations
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Teams]
      summary: Mời qua email hoặc tạo liên kết dùng một lần (token chỉ trả về một lần); mời MANAGER cần MANAGE_MANAGERS (3831)
      operationId: invite
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInviteRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/invitations/{invitationId}:
    delete:
      tags: [Teams]
      summary: Thu hồi lời mời (cùng quy tắc như khi mời, 3831)
      operationId: revokeTeamsInvitations
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/members:
    get:
      tags: [Teams]
      summary: Thành viên team
      operationId: members
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/members/{memberId}:
    patch:
      tags: [Teams]
      summary: Đổi vai trò thành viên theo bảng quyền của team (MANAGE_MEMBERS / MANAGE_MANAGERS; vai trò OWNER chỉ OWNER trao; 3831)
      operationId: changeRole
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRoleRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Teams]
      summary: Gỡ thành viên (cùng quy tắc như đổi vai trò, 3831) hoặc rời team (truyền id của chính mình)
      operationId: removeMemberTeams
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/permissions:
    get:
      tags: [Teams]
      summary: Quyền của từng vai trò trong team (mọi thành viên xem được); editable = tôi là chủ
      operationId: permissions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamPermissionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Teams]
      summary: Bật / tắt quyền của MANAGER, ARRANGER, VIEWER (chỉ OWNER, 3830)
      operationId: updatePermissions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamPermissionsRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamPermissionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/restore:
    post:
      tags: [Teams]
      summary: Khôi phục team tôi đã xóa (OWNER, trong vòng 30 ngày); 3818 quá hạn, 3819 bị admin xóa
      operationId: restore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/scores:
    get:
      tags: [Teams]
      summary: Bản nhạc của team
      operationId: scores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamScoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Teams]
      summary: Chuyển bản nhạc cá nhân vào team (chỉ chủ bản nhạc)
      operationId: addScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamScoreRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamScoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/scores/candidates:
    get:
      tags: [Teams]
      summary: Bản nhạc cá nhân của tôi có thể chuyển vào team
      operationId: candidates
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamScoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/scores/{scoreId}:
    delete:
      tags: [Teams]
      summary: Chuyển bản nhạc ra khỏi team (chủ bản nhạc hoặc REMOVE_SCORES)
      operationId: removeScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/shows:
    get:
      tags: [Teams]
      summary: Show của team (đang chuẩn bị trước)
      operationId: shows
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListShowResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Teams]
      summary: Tạo show (cần MANAGE_SHOWS)
      operationId: createShow
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/teams/{id}/shows/deleted:
    get:
      tags: [Teams]
      summary: Show đã xóa của team, còn khôi phục được (MANAGE_SHOWS; 30 ngày)
      operationId: deletedShows
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListRestorableItemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Team invitations ────────────────────────
  /api/team-invitations/mine:
    get:
      tags: [Team invitations]
      summary: Lời mời qua email đang chờ, gửi tới email của tôi
      operationId: mine
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseListTeamInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/team-invitations/mine/{id}/accept:
    post:
      tags: [Team invitations]
      summary: Chấp nhận lời mời qua email gửi cho tôi
      operationId: acceptMine
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/team-invitations/mine/{id}/decline:
    post:
      tags: [Team invitations]
      summary: Từ chối lời mời qua email gửi cho tôi
      operationId: declineMine
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/team-invitations/token/{token}:
    get:
      tags: [Team invitations]
      summary: Xem trước lời mời từ token trong liên kết
      operationId: preview
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamInvitationPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/team-invitations/token/{token}/accept:
    post:
      tags: [Team invitations]
      summary: Chấp nhận lời mời từ token trong liên kết (dùng một lần)
      operationId: accept
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Shows ───────────────────────────────────
  /api/shows/{id}:
    get:
      tags: [Shows]
      summary: Show kèm hạng mục, vai trò của tôi và thành viên có thể giao việc
      operationId: getShows
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseShowDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
