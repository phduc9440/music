          type: string
        myRole:
          type: string
          enum:
            - OWNER
            - MANAGER
            - ARRANGER
            - VIEWER
        myPermissions:
          type: array
          items:
            type: string
            enum:
              - EDIT_TEAM
              - MANAGE_MANAGERS
              - MANAGE_MEMBERS
              - MANAGE_SHOWS
              - APPROVE_ANY
              - EDIT_SCORES
              - MANAGE_SCORES
              - REMOVE_SCORES
              - ADD_SCORES
              - COMMENT
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShowItemResponse'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberResponse'
    ShowItemOrderRequest:
      type: object
      properties:
        itemIds:
          type: array
          items:
            type: string
