        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/musicxml:
    get:
      tags: [Score content]
      summary: MusicXML hiện hành của bản nhạc (application/vnd.recordare.musicxml+xml)
      description: "Cần quyền xem bản nhạc. Header ETag có dạng \"v{version}\"; gửi lại qua If-None-Match thì trả 304 khi chưa có bản mới. Errors: 2001 không có bản nhạc, 1002 không có quyền, 2012 chưa có MusicXML, 2002 file đã mất"
      operationId: getMusicXml
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          description: ETag đã nhận lần trước, ví dụ "v1"
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/vnd.recordare.musicxml+xml:
              schema:
                type: string
                format: byte
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Score edit]
      summary: Lưu MusicXML mới thành version kế tiếp
      description: "Body là MusicXML (Content-Type application/vnd.recordare.musicxml+xml, application/xml hoặc text/xml, tối đa 5MB). Bắt buộc header If-Match: \"v{currentVersion}\" (bỏ qua khi force=true). Trả ETag \"v{version mới}\". MIDI không sinh ngay mà được sinh lại ở lần tải MIDI kế tiếp. Errors: 2001 không có bản nhạc, 1002 không có quyền sửa (hoặc force mà không phải chủ sở hữu/ADMIN), 2005 body rỗng hoặc quá lớn, 2013 Content-Type hoặc nội dung MusicXML không hợp lệ, 2201 đang có tác vụ nhận diện, 2012 chưa có MusicXML, 2014 xung đột version (result.currentVersion là version mới nhất)"
      operationId: saveMusicXml
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          schema:
            type: string
        - name: If-Match
          in: header
          description: Version đang sửa, ví dụ "v5"
          required: false
          schema:
            type: string
        - name: force
          in: query
          description: true để ghi đè dù version đã đổi (chỉ chủ sở hữu hoặc ADMIN)
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreSaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

