      description: "Mỗi phần tử có version, createdAt, savedByName, measureCount, sizeBytes, isCurrent và source (EDITOR, OMR, IMPORT, RESTORE). Cần quyền xem bản nhạc. Errors: 2001 không có bản nhạc, 1002 không có quyền"
