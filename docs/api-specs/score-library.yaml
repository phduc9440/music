# ============================================================
# Score Library — OpenAPI 3.0 Specification
# ============================================================
openapi: 3.0.3
info:
  title: Score Library API
  description: |
    Thư viện bản nhạc: bản nhạc của tôi, Khám phá, kho nhạc mẫu, được chia sẻ; tạo / nhập / sửa thông tin, ảnh bìa,
    thể loại, thùng rác; nội dung MusicXML / MIDI / kern, lịch sử phiên bản; xuất file; lượt xem; phối lại.

    Mọi phản hồi JSON bọc trong ApiResponse {code, message, result}; code = 200 khi thành công,
    lỗi trả mã nghiệp vụ (ví dụ 1001 chưa đăng nhập, 1002 không có quyền) kèm HTTP status tương ứng.
    Sinh từ controller của music-be (springdoc /v3/api-docs) rồi chia theo nhóm chức năng.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: music-be (Spring Boot) khi chạy local
tags:
  - name: Scores
    description: "Thư viện của thành viên hiện tại: danh sách, chi tiết, sửa thông tin, xóa; Khám phá, kho nhạc mẫu, chia sẻ, phối lại"
  - name: Score create
    description: Tạo bản nhạc không cần tải file
  - name: Score import
    description: Nhập trực tiếp MusicXML / MIDI (không qua OMR)
  - name: Score files
    description: Liệt kê và tải các file gắn với bản nhạc
  - name: Score content
    description: Nội dung kết quả của bản nhạc (kern, MusicXML, MIDI)
  - name: Score edit
    description: Lưu chỉnh sửa MusicXML từ trình chỉnh sửa
  - name: Score trash
    description: Bản nhạc đã xóa nằm trong thùng rác 30 ngày trước khi bị xóa hẳn
  - name: Tags
    description: Danh sách thể loại để gắn nhãn bản nhạc
  - name: Official library requests
    description: Admin xin chủ bản đưa bản nhạc công khai vào kho nhạc mẫu; chủ bản quyết định
  - name: Export
    description: Xuất bản nhạc ra MP3, WAV (và các định dạng khác) bằng MuseScore
  - name: Playback
    description: "Phát nhạc: lượt xem và phiên nghe"

paths:
  # ─── Scores ──────────────────────────────────
  /api/scores/me:
    get:
      tags: [Scores]
      summary: Danh sách bản nhạc của tôi (tìm kiếm, lọc, phân trang)
      description: "status: NONE|PENDING|PROCESSING|COMPLETED|FAILED; source: OMR|IMPORT|MANUAL; difficulty: EASY|MEDIUM|HARD|EXPERT; tagId: id lấy từ GET /api/tags; sort: newest (theo ngày cập nhật, mặc định) | created | oldest | title | views; size: 1..50. Thẻ có viewCount, ratingAverage và ratingCount."
      operationId: getMyScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
        - name: tagId
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: newest
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/scores/official:
    get:
      tags: [Scores]
      summary: "Kho nhạc mẫu cho người mới học (dễ nhất trước); difficulty: EASY|MEDIUM|HARD|EXPERT"
      operationId: getOfficialScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
        - name: composerId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/scores/official/candidates:
    get:
      tags: [Scores]
      summary: "ADMIN: bản nhạc công khai chưa có trong kho nhạc mẫu"
      operationId: getOfficialCandidates
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/scores/pending-public:
    get:
      tags: [Scores]
      summary: "ADMIN: bản nhạc chủ bản xin công khai, đang chờ duyệt"
      operationId: getPendingPublic
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 12
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/scores/public:
    get:
      tags: [Scores]
      summary: "Khám phá: bản nhạc PUBLIC; keyword (tên / tác giả), difficulty, tagId, composerId, staffs (1 | 2 | 3 = từ ba khuông trở lên), key (ví dụ G, Am); sort: NEWEST (mặc định) | VIEWS | RATING"
      description: Thẻ có ownerName (không bao giờ lộ email chủ), viewCount, ratingAverage và ratingCount.
      operationId: getPublicScores
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 12
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
        - name: tagId
          in: query
          required: false
          schema:
            type: string
        - name: composerId
          in: query
          required: false
          schema:
            type: string
        - name: staffs
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/scores/shared-with-me:
    get:
      tags: [Scores]
      summary: Bản nhạc người khác chia sẻ với tôi (qua lời mời hoặc yêu cầu đã duyệt), kèm mức quyền của tôi
      operationId: getSharedWithMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 12
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePageResponseScoreSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/scores/{scoreId}:
    get:
      tags: [Scores]
      summary: Chi tiết bản nhạc (thông tin + file hiện hành + tác vụ mới nhất của mỗi loại)
      operationId: getScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Scores]
      summary: Sửa thông tin bản nhạc (title, composer, difficulty, studyNotes, visibility; chủ bản không phải admin chọn PUBLIC thì thành PENDING tới khi ADMIN duyệt); trường null được giữ nguyên
      operationId: updateScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreUpdateRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Scores]
      summary: Chuyển bản nhạc vào thùng rác 30 ngày (chủ bản, hoặc ADMIN kiểm duyệt bản PUBLIC/PENDING)
      description: Bị chặn khi đang có tác vụ chạy. ADMIN có thể gửi kèm lý do để báo cho chủ bản. Xem thêm GET /api/scores/trash, POST /{id}/restore và DELETE /{id}/purge.
      operationId: deleteScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/cover:
    post:
      tags: [Scores]
      summary: Tải lên ảnh bìa bản nhạc (JPG/PNG, tối đa 3MB; cần quyền sửa); thay ảnh cũ
      description: "Lưu trên Cloudinary như ảnh đại diện. Lỗi: 2025 ảnh không hợp lệ, 2007 lỗi lưu trữ"
      operationId: uploadCover
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Scores]
      summary: Gỡ ảnh bìa bản nhạc (quay về dùng ảnh trang đầu)
      operationId: removeCover
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/fork:
    post:
      tags: [Scores]
      summary: Tạo bản phối của riêng tôi từ một bản PUBLIC mà chủ cho phép phối lại (R4)
      description: "Bản sao riêng tư, ghi nhớ bản gốc và kế thừa giấy phép. Lỗi: 2001 không công khai, 2027 không được phép phối, 2028 quá 20 lần trong 24 giờ, MUSICXML_NOT_READY"
      operationId: fork
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/official:
    delete:
      tags: [Scores]
      summary: "ADMIN: gỡ bản nhạc khỏi kho nhạc mẫu (bản sao chuyển vào thùng rác, bản gốc của chủ giữ nguyên)"
      operationId: unmarkOfficial
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/publish/approve:
    post:
      tags: [Scores]
      summary: "ADMIN: duyệt công khai bản nhạc (mọi người đã đăng nhập xem và đánh giá được)"
      operationId: approvePublic
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/publish/reject:
    post:
      tags: [Scores]
      summary: "ADMIN: từ chối công khai bản nhạc; bản quay về PRIVATE kèm lý do tùy chọn"
      operationId: rejectPublic
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPublishRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/tags:
    put:
      tags: [Scores]
      summary: Thay toàn bộ thể loại của bản nhạc (tối đa 10, danh sách rỗng là gỡ hết)
      description: "Lỗi: 2301 không có thể loại, 2302 quá nhiều thể loại"
      operationId: updateTags
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreTagsRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Score create ────────────────────────────
  /api/scores/blank:
    post:
      tags: [Score create]
      summary: Tạo bản nhạc trống từ mẫu nhạc cụ
      description: "Lỗi: 2017/2018 tên hoặc tác giả không hợp lệ, 3302 tùy chọn không hợp lệ"
      operationId: createBlank
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlankScoreRequest'
        required: true
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseBlankScoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Score import ────────────────────────────
  /api/scores/import:
    post:
      tags: [Score import]
      summary: Nhập một file MusicXML (.musicxml/.xml/.mxl) hoặc MIDI (.mid/.midi)
      description: "Lỗi: 2003 file rỗng, 2012 MusicXML không hợp lệ, 2013 MIDI không hợp lệ, 2014 loại file không hỗ trợ, 2017/2018 tên hoặc tác giả quá dài, 2301 không có thể loại, 2302 quá nhiều thể loại (tagIds tùy chọn, lặp lại trường cho mỗi thể loại)"
      operationId: importScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: title
          in: query
          required: false
          schema:
            type: string
        - name: composer
          in: query
          required: false
          schema:
            type: string
        - name: tagIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─── Score files ─────────────────────────────
  /api/files/{fileId}/download:
    get:
      tags: [Score files]
      summary: Tải file (inline=true để hiển thị trong trình duyệt)
      operationId: download
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
        - name: inline
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Thành công
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/scores/{scoreId}/files:
    get:
      tags: [Score files]
      summary: Danh sách file của bản nhạc (tùy chọn ?type=PNG|MUSICXML|... để lọc theo loại file)
      operationId: getFilesOfScore
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - ORIGINAL_PDF
              - ORIGINAL_IMAGE
              - KERN
              - MUSICXML
              - MIDI
              - PDF
              - SVG
              - PNG
              - MP3
              - WAV
              - ORIGINAL_MUSICXML
              - ORIGINAL_MIDI
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
