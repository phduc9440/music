    post:
      tags: [Export]
      summary: Yêu cầu xuất file. Có file cùng tùy chọn thì trả ngay (cached), không thì tạo task chạy nền
      description: "Định dạng: MP3, WAV (nhạc), PDF (options: pageSize A4/LETTER, orientation PORTRAIT/LANDSCAPE, staffSpaceMm 1.5-2.2, marginMm 10-25, showTitle, measureNumbers SYSTEM/EVERY/NONE, showChords), SVG (mọi trang, tải ZIP qua /exports/{taskId}/zip), MIDI và MUSICXML (trả file hiện hành ngay, không cần options). Body: {\"targetFormat\":\"MP3\",\"options\":{\"bitrate\":192,\"tempoPercent\":75,\"transpose\":2,\"hands\":\"BOTH\"}}. bitrate chỉ cho MP3 (128/192/320), tempoPercent 20-200, transpose -12..12, hands RIGHT/LEFT chỉ khi bản nhạc có đúng 2 khuông. Theo dõi task bằng GET /api/ai-tasks/{id}. Errors: 1002 không có quyền xem, 2001 không có bản nhạc, 2012 chưa có MusicXML, 2701 tùy chọn sai, 2702 bản nhạc quá dài (tối đa 20 phút), 2703 quá giới hạn (2 task đang chạy / 10 task mỗi giờ), 2704 máy chủ chưa cấu hình MuseScore"
      operationId: requestExport
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
