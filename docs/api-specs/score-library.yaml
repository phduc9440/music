      description: "Cần quyền xem bản nhạc. Nếu MIDI chưa có hoặc cũ hơn MusicXML thì sinh lại trước khi trả (đồng bộ, thường dưới 2 giây). Errors: 2001 không có bản nhạc, 1002 không có quyền, 2012 chưa có MusicXML, 2103 music-ai không sinh lại được, 2002 file đã mất"
      operationId: getMidi
