      summary: File xuất còn trên đĩa của bản nhạc, kèm tùy chọn và cờ outdated (bản nhạc đã sửa sau lúc xuất)
      description: "Errors: 1002 không có quyền xem, 2001 không có bản nhạc"
      operationId: listExports
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
      responses:
