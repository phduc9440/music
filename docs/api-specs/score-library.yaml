  /api/scores/{scoreId}/versions/{version}/diff:
    get:
      tags: [Score edit]
      summary: So sánh một phiên bản MusicXML với bản gốc (mặc định là bản do nhận diện sinh ra)
      description: "Đo công sửa sau khi số hóa: ô giữ nguyên, ô sửa, ô OMR sinh thừa (deleted), ô OMR bỏ sót (added) và lỗi nốt theo loại. Tham số base là version gốc, bỏ trống thì dùng bản OMR. Kết quả được lưu để lần sau trả ngay (cached = true). Errors: 2001, 1002, 2801, 2901 không có bản gốc, 2902 trùng version, 2903 không đọc được MusicXML, 2103 music-ai không khả dụng"
      operationId: diffVersion
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: base
          in: query
          description: Version gốc để so; bỏ trống thì dùng bản do OMR sinh ra
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseScoreDiffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
