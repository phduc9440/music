server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Khớp giới hạn upload của BE (MAX_REQUEST_SIZE mặc định 200MB).
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://music-be:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Kênh WebSocket (STOMP) cho chuông thông báo và đồng chỉnh sửa
    location /ws {
        proxy_pass http://music-be:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Worker của pdf.js là file .mjs; mime.types mặc định của nginx không có đuôi này nên trả application/octet-stream,
    # trình duyệt từ chối chạy module worker và mọi PDF bị báo "không mở được". Khai báo đúng MIME cho riêng .mjs
    # (đặt types trong location để không ghi đè bảng MIME của các file khác).
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
    }

    # Mọi đường dẫn lạ trả index.html để React Router xử lý.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
